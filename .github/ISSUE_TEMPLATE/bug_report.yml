name: Bug report
description: The node does not behave as its documentation or API contract says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. Security problems do not go here: see
        [SECURITY.md](https://github.com/FortisNet/node/blob/main/SECURITY.md).
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The request, or the steps. Remove credentials and anything else you do not want public.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node release or commit
      description: The release version, or the commit it was built from.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: What `/errors` shows
      description: The relevant entries of the node's public error board, if any.
      render: text
