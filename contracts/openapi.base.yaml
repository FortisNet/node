          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/address/{address}/balances:
    get:
      tags: [Accounts]
      operationId: getAddressBalances
      summary: Read native and tracked-token balances
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/Address'
        - name: tokens
          in: query
          description: Optional comma-separated tracked token IDs; at most 200.
          schema: { type: string, maxLength: 8000 }
      responses:
        '200':
          description: Balance payload with `asOf`, `stale` and cache provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBalances' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/address/{address}/transfers:
    get:
      tags: [Accounts]
      operationId: getAddressTransfers
      summary: Read durable paginated transfer history
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/Address'
        - name: since
          in: query
          description: Opaque delta-sync cursor returned by an earlier request.
          schema: { type: string, maxLength: 40 }
        - name: before
          in: query
          description: Opaque newest-first display cursor. Mutually exclusive with `since`.
          schema: { type: string, maxLength: 600 }
        - name: refresh
          in: query
          description: Set to `true` for an explicit user refresh that bypasses the normal short freshness window.
          schema: { type: string, enum: ['true'] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: token
          in: query
          description: Restrict results to one token ID.
          schema: { type: string, maxLength: 120 }
        - name: priceId
          in: query
          description: Canonical market-data identity for bounded receipt-value repair. Registry identity takes precedence.
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,99}$' }
        - name: from
          in: query
          description: Inclusive UTC epoch-second chart boundary.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to
          in: query
          description: Inclusive UTC epoch-second chart boundary.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: flow
          in: query
          description: Token-leg direction; requires `token`.
          schema: { type: string, enum: [in, out, neutral] }
      responses:
        '200':
          description: Durable transfer page and delta-sync cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransfersPage' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/address/{address}/nfts:
    get:
      tags: [Accounts]
      operationId: getAddressNfts
      summary: Read NFT holdings and display metadata
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/Address'
      responses:
        '200':
          description: Reconciled NFT inventory with proxied and source media locations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NftInventory' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/address/{address}/insight:
    get:
      tags: [Accounts]
      operationId: getAddressInsight
      summary: Read condensed address analytics
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/Address'
      responses:
        '200':
          description: Address existence/type/activity insight with SWR provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressInsight' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/tx/{hash}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Read normalized transaction details
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/Hash'
      responses:
        '200':
          description: Normalized transaction state and chain detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/tx/{hash}/view:
    get:
      tags: [Transactions]
      operationId: getTransactionView
      summary: Read Flutter-compatible chain-native transaction JSON
      description: Returns the app's existing family-specific detail shape verbatim. Unsupported families return 400 and unknown transactions return 404 so the client can fall back to direct RPC.
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/Hash'
      responses:
        '200':
          description: Flutter-compatible chain-native transaction view.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/token/{tokenId}/page:
    get:
      tags: [Tokens]
      operationId: getTokenPage
      summary: Read everything one token screen shows
      description: |
        One request for a token page: identity, the resolved quote, market
        figures, profile, liquidity, holder count, the safety verdict and
        (opt-in) a price series — all in the app's own vocabulary rather than an
        upstream provider's field names.

        `tokenId` accepts the full ref grammar: `native`, a bare or prefixed
        contract / mint / asset id / issuer pair (`erc20:0x…`, `trc20:T…`, `trc10:1001305`, `spl:…`,
        `asa:…`, `cardano:…`, `stellar:CODE-ISSUER`, `hts:0.0.x`,
        `xrpl:CODE.issuer`), `symbol:BTC`, or `cg:{coinId}`. A bare identifier is
        resolved against the network's family, so callers can pass exactly what
        the chain calls the token.

        Every section is independently cached, fails soft and reports its own
        provenance in `cache`; a section that could not be read is `null` with an
        entry in `errors`. `null` always means unknown, never zero.
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/TokenId'
        - $ref: '#/components/parameters/TokenPageInclude'
        - $ref: '#/components/parameters/TokenPageDays'
        - $ref: '#/components/parameters/TokenPageInterval'
        - $ref: '#/components/parameters/TokenPageCoingeckoId'
      responses:
        '200':
          description: The composed token page, with per-section cache provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPage' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '304': { description: The exact page representation is unchanged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/tokens/compare:
    post:
      tags: [Tokens]
      operationId: compareTokens
      summary: Compare trader metrics for up to 20 tokens
      description: |
        Performs one bounded database read over the current market and liquidity
        projection. It never fans out to providers. Inputs are canonicalized by
        the network token grammar; invalid and duplicate inputs fail soft in
        `errors`, while valid tokens with no observations return null metrics.

        Market price, market cap and 24-hour volume prefer the market provider
        and fall back independently to DEX observations. Liquidity is DEX-only.
        Every metric carries its own source, timestamp and freshness status;
        null means unknown, never zero. Ranks are competition ranks within this
        request (`1, 1, 3`) and price is deliberately not ranked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenComparisonRequest' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.TokenComparisonRequest' }
      responses:
        '200':
          description: A request-ordered comparison with per-metric provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenComparisonResponse' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.TokenComparisonResponse' }
        '304': { description: The comparison values and freshness states are unchanged. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/networks/{network}/token/{tokenId}:
    get:
      tags: [Tokens]
      operationId: getToken360
      summary: Read token metadata, market and risk details
      x-fortis-client-status: superseded
      description: |
        The raw facet document: `market` and `profile` are relayed in the
        upstream provider's own shape. Superseded by
        `GET /v1/networks/{network}/token/{tokenId}/page`, which returns the
        same facts normalized to the app's vocabulary plus identity, the
        resolved quote and an optional price series. Retained because shipped
        clients parse the provider field names directly.
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          description: Independently cached and fail-soft token intelligence facets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token360' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/token/{tokenId}/holders/history:
    get:
      tags: [Tokens]
      operationId: getTokenHolderHistory
      summary: Read holder-count and ranked-distribution history
      description: |
        The daily holder counts this deployment has stored, newest first, plus
        the 24h/7d/30d/90d/365d growth computed from them. The distribution
        block separately returns daily concentration summaries and standard-
        window address diffs: entries, exits, rank movement, and percentage-
        point share changes.

        Every observation is returned, including the ones a trend calculation
        must discard: a lower-bound count (`atLeast`) can never anchor a
        percentage, and observations are only compared within a single
        `source`, because two indexers count different populations. A window
        with no usable baseline is `null` — never `0`, which would claim the
        holder base is flat.
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/TokenId'
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 400
            default: 30
          description: |
            How far back to return observations. The maximum matches the
            observation retention, so a client explaining the 365d window can
            ask for the history that window was computed from.
        - name: source
          in: query
          schema: { type: string, minLength: 1, maxLength: 80 }
          description: |
            Provider selected by the canonical token model. When supplied,
            trend percentages use only that provider's series; observations
            still include every provider for diagnostics.
      responses:
        '200':
          description: Count evidence, count trends, and ranked-holder comparisons.
          content:
            application/json:
              schema:
                type: object
                required: [network, tokenId, trendSource, observations, trends, distribution]
                properties:
                  network: { type: string }
                  tokenId: { type: string }
                  trendSource: { type: [string, 'null'] }
                  observations:
                    type: array
                    items:
                      type: object
                      required: [at, count, atLeast, source]
                      properties:
                        at: { type: string, format: date-time }
                        count: { type: integer, minimum: 0 }
                        atLeast:
                          type: boolean
                          description: The count is a lower bound, so it anchors no percentage.
                        source: { type: string, minLength: 1 }
                  trends:
                    type: [object, 'null']
                    required: [change24hPct, change7dPct, change30dPct, change90dPct, change365dPct, latestAt]
                    description: |
                      There is no 1h or 6h window and there cannot be: a holder
                      count is recorded once per UTC day, so the number does not
                      move within a day. Sub-daily growth would be invented.
                    properties:
                      change24hPct: { type: [number, 'null'] }
                      change7dPct: { type: [number, 'null'] }
                      change30dPct: { type: [number, 'null'] }
                      change90dPct: { type: [number, 'null'] }
                      change365dPct: { type: [number, 'null'] }
                      latestAt: { type: string, format: date-time }
                  distribution:
                    type: object
                    required: [snapshots, comparisons]
                    properties:
                      snapshots:
                        type: array
                        description: Daily concentration summaries, newest first.
                        items:
                          type: object
                          required: [at, source, positionCount, topHoldersPercent, topHoldersPercentExcludingLocked, burnedPercent]
                          properties:
                            at: { type: string, format: date-time }
                            source: { type: string }
                            positionCount: { type: integer, minimum: 0 }
                            topHoldersPercent: { type: [number, 'null'] }
                            topHoldersPercentExcludingLocked: { type: [number, 'null'] }
                            burnedPercent: { type: [number, 'null'] }
                      comparisons:
                        type: array
                        items:
                          type: object
                          required: [window, latestAt, baselineAt, topHoldersPercentPointChange, liveWalletPercentPointChange, burnedPercentPointChange, positions]
                          properties:
                            window: { type: string, enum: [24h, 7d, 30d, 90d, 12m] }
                            latestAt: { type: string, format: date-time }
                            baselineAt: { type: [string, 'null'], format: date-time }
                            topHoldersPercentPointChange: { type: [number, 'null'] }
                            liveWalletPercentPointChange: { type: [number, 'null'] }
                            burnedPercentPointChange: { type: [number, 'null'] }
                            positions:
                              type: array
                              items:
                                type: object
                                required: [address, tag, kind, currentRank, previousRank, rankChange, currentPercent, previousPercent, percentagePointChange, currentBalance, previousBalance, balanceChange, currentIsContract, previousIsContract, currentIsLocked, previousIsLocked]
                                properties:
                                  address: { type: string }
                                  tag: { type: [string, 'null'] }
                                  kind: { type: string, enum: [entered, exited, changed, unchanged] }
                                  currentRank: { type: [integer, 'null'] }
                                  previousRank: { type: [integer, 'null'] }
                                  rankChange: { type: [integer, 'null'], description: Positive means movement toward rank 1. }
                                  currentPercent: { type: [number, 'null'] }
                                  previousPercent: { type: [number, 'null'] }
                                  percentagePointChange: { type: [number, 'null'] }
                                  currentBalance: { type: [number, 'null'] }
                                  previousBalance: { type: [number, 'null'] }
                                  balanceChange: { type: [number, 'null'] }
                                  currentIsContract: { type: [boolean, 'null'] }
                                  previousIsContract: { type: [boolean, 'null'] }
                                  currentIsLocked: { type: [boolean, 'null'] }
                                  previousIsLocked: { type: [boolean, 'null'] }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '304': { description: The exact history representation is unchanged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/networks/{network}/token/{tokenId}/liquidity/history:
    get:
      tags: [Tokens]
      operationId: getTokenLiquidityHistory
      summary: Read token liquidity, execution-quality, and pool-health history
      description: |
        Returns token-level liquidity and price OHLC, spread, pool
        concentration, rolling 24-hour activity gauges, point-in-time changes,
        and sample coverage. Rolling gauges are closing values and are never
        summed across observation timestamps.
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/TokenId'
        - name: range
          in: query
          schema:
            type: string
            enum: [1d, 7d, 30d, 90d, 1y]
            default: 30d
        - name: interval
          in: query
          schema:
            type: string
            enum: [1h, 1d, 1w]
            default: 1h
      responses:
        '200':
          description: Liquidity history with explicit availability and coverage.
          content:
            application/json:
              schema:
                type: object
                required: [network, tokenId, range, interval, availability, changes, series, coverage]
                properties:
                  network: { type: string }
                  tokenId: { type: string }
                  range: { type: string, enum: [1d, 7d, 30d, 90d, 1y] }
                  interval: { type: string, enum: [1h, 1d, 1w] }
                  availability:
                    type: object
                    required: [status, checkedAt, lastSuccessfulAt, source, stale, latestAgeSeconds]
                    properties:
                      status: { type: string, enum: [ok, not_found, unsupported, error, unknown] }
                      checkedAt: { type: [string, 'null'], format: date-time }
                      lastSuccessfulAt: { type: [string, 'null'], format: date-time }
                      source: { type: [string, 'null'] }
                      stale: { type: boolean }
                      latestAgeSeconds: { type: [integer, 'null'], minimum: 0 }
                  latest: { type: [object, 'null'], additionalProperties: true }
                  changes: { type: object, additionalProperties: true }
                  series:
                    type: array
                    items: { type: object, additionalProperties: true }
                  coverage: { type: object, additionalProperties: true }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.StructuredReadResponse' }
        '304': { description: The exact history representation is unchanged. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/networks/{network}/token/{tokenId}/liquidity/pools:
    get:
      tags: [Tokens]
      operationId: getTokenLiquidityPools
      summary: Read every current liquidity pool for a token
      description: |
        Opt-in detail projection used when a user expands the Liquidity card.
        Unlike the compact token-page projection, this response does not cap
        the pool list. It is cached independently so a compact response can
        never satisfy a complete-list caller.
      parameters:
        - $ref: '#/components/parameters/Network'
        - $ref: '#/components/parameters/TokenId'
