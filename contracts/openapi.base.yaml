openapi: 3.0.3
info:
  title: FortisNet Intelligence API
  version: 0.1.0
  description: |
    Read-side API for the FortisWallet self-custody client. The service enriches
    public blockchain data with balances, history, NFTs, market data, charts and
    exchange quotes while keeping provider credentials on the server.

    Signing, key management, transaction construction/broadcast and keyless
    current-balance fallback remain client-side and are deliberately not part of
    this API. No wallet seed or private key may ever be sent here.

    All `/v1` operations except enrollment and media require a short-lived device
    bearer token. Obtain it through the attestation challenge and device enrollment
    flow. This browser documentation is read-only; use a native client or `curl` for
    authenticated requests. Production enrollment requires Apple App Attest or Play
    Integrity; development enrollment is private-network only.

    Cache-aware responses expose `cache.hit` and `cache.timestamp`. A response may
    also set `cache.partial` when only part of a requested time window was already
    cached. Historical-price responses include `availability` so clients can draw
    the portion that exists when an upstream source has incomplete history.
  contact:
    name: FortisWallet API maintainers
servers:
  - url: http://localhost:8788
    description: Local server (iOS simulator, desktop and web)
  - url: http://10.0.2.2:8788
    description: Local server from an Android emulator
tags:
  - name: System
    description: Liveness and public media delivery.
  - name: Device authentication
    description: Device attestation, enrollment and bearer-token rotation.
  - name: Diagnostics
    description: Privacy-minimized, write-only client crash reports.
  - name: Capabilities
    description: Runtime network and provider capability discovery.
  - name: Prices
    description: Spot and gap-aware historical token prices.
  - name: Portfolio
    description: Condensed multi-account reads and portfolio charts.
  - name: Accounts
    description: Address balances, history, NFTs, trustlines and analytics.
  - name: Transactions
    description: Normalized and chain-native transaction details.
  - name: Tokens
    description: Token metadata, discovery and market charts.
  - name: Bittensor
    description: Allow-listed Taostats analytics proxy.
  - name: Exchange
    description: Generic cross-chain routing plus compatibility exchange-provider proxies.
  - name: Updates
    description: Poll-based change feed — which of this device's accounts changed.
  - name: News
    description: The aggregated news wire — clustered headlines from public publisher feeds.
  - name: Gems
    description: New Gems — a discovery feed of tokens the wallet does not hold, each carried as a whole token page.
  - name: Support
    description: Help desk — a verified wallet's tickets and the protected staging operator view.
  - name: AI
    description: Signed, wallet-bound Intelligence conversations for the AI tab.
security:
  - deviceBearer: []
paths:
  /:
    get:
      tags: [System]
      operationId: landingPage
      summary: Human-facing landing page
      description: On a managed host, the host orchestrator's first page, handed out unchanged. Otherwise the node's built-in introduction with its configuration-derived service checklist. Not consumed by the app.
      security: []
      responses:
        '200':
          description: Landing page HTML.
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      tags: [System]
      operationId: hostHealthPage
      summary: Health of this host, as a page
      description: Written by the host orchestrator and handed out unchanged. Answers 200 only when the orchestrator and the node are healthy; 503 otherwise, including when the report is missing or older than a minute. The existing /healthz is unchanged.
      security: []
      responses:
        '200':
          description: Health report HTML; everything is healthy.
          content:
            text/html:
              schema: { type: string }
        '503':
          description: Something needs attention, or no fresh report exists.
  /health.json:
    get:
      tags: [System]
      operationId: hostHealthReport
      summary: Health of this host, for monitoring tools
      description: The same report as /health in a fixed, versioned form, with the same status codes. No paths, keys, setting values, device identifiers or provider responses.
      security: []
      responses:
        '200':
          description: Health report; everything is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, generatedMs, status, healthy, orchestrator, node]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  generatedMs: { type: integer, format: int64 }
                  status: { type: integer, enum: [200, 503] }
                  healthy: { type: boolean }
                  orchestrator: { type: object }
                  node: { type: object }
        '503':
          description: Something needs attention, or no fresh report exists.
  /releases:
    get:
      tags: [System]
      operationId: nodeReleasePage
      summary: Public executable identity and deployment history
      description: Read-only controller observations with UTC serving boundaries, uncertainty, provenance and update progress. Does not activate releases.
      security: []
      responses:
        '200':
          description: Deployment history HTML.
          content:
            text/html:
              schema: { type: string }
  /releasesz:
    get:
      tags: [System]
      operationId: nodeReleaseStatus
      summary: Current controller release observation
      description: Sanitized read-only metadata. Missing controller metadata reports managed=false. Timestamp freshness is not a continuous health guarantee. No-store; caller must label stale observations.
      security: []
      responses:
        '200':
          description: Controller snapshot or explicit unmanaged state.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, managed, current, candidate, latestPage, observedAtMs]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  managed: { type: boolean }
                  observedAtMs: { type: integer, format: int64, nullable: true }
                  latestPage: { type: integer, minimum: 0, nullable: true }
                  sequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
                  current: { nullable: true, allOf: [{ $ref: '#/components/schemas/ReleaseDeployment' }] }
                  candidate: { nullable: true, allOf: [{ $ref: '#/components/schemas/ReleaseDeployment' }] }
        '400':
          description: Invalid query.
        '503':
          description: Metadata is corrupt, unreadable or beyond its bounded size. No private paths or contents returned.
  /releasesz/history:
    get:
      tags: [System]
      operationId: nodeReleaseHistory
      summary: One stable page of deployment observations
      description: At most 25 activations per page, newest first. Page IDs group deployment IDs and do not shift when a new activation is added. Earlier page cursors remain valid; individual lifecycle records can be updated while active. No-store.
      security: []
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 360287970189639 }
      responses:
        '200':
          description: Bounded history page.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, page, previousPage, records]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  page: { type: integer, minimum: 0 }
                  previousPage: { type: integer, minimum: 0, nullable: true }
                  records:
                    type: array
                    maxItems: 25
                    items: { $ref: '#/components/schemas/ReleaseDeployment' }
        '400':
          description: Missing or invalid bounded page number.
        '404':
          description: No retained history page with this ID.
        '503':
          description: Corrupt, unreadable or oversized metadata.
  /dashboard:
    get:
      tags: [System]
      operationId: nodeDashboard
      summary: Public node observability dashboard
      description: Resource and API performance charts with measurement explanations and diagnostic links.
      security: []
      responses:
        '200':
          description: Public node observability dashboard.
          content:
            text/html:
              schema: { type: string }
  /node-features.json:
    get:
      tags: [System]
      operationId: nodeFutureFeatures
      summary: Possible future node features
      description: Versioned possible-feature catalog. These are ideas, not enabled interfaces or delivery commitments.
      security: []
      responses:
        '200':
          description: Possible future node features.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, status, notice, features]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  status: { type: string, enum: [possible] }
                  notice: { type: string, minLength: 1, maxLength: 480 }
                  features:
                    type: array
                    minItems: 1
                    maxItems: 16
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, description]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 240, pattern: '^[a-z0-9-]+$' }
                        name: { type: string, minLength: 1, maxLength: 240 }
                        description: { type: string, minLength: 1, maxLength: 240 }
  /assets/node-hall.webp:
    get:
      tags: [System]
      operationId: nodeHallImage
      summary: Branded node background
      description: Embedded FortisNet node-hall image.
      security: []
      responses:
        '200':
          description: Branded node background.
          content:
            image/webp:
              schema: { type: string }
  /assets/fortis-favicon.svg:
    get:
      tags: [System]
      operationId: nodeFavicon
      summary: FortisNet favicon
      description: Embedded FortisNet mark on a contrasting background.
      security: []
      responses:
        '200':
          description: FortisNet favicon.
          content:
            image/svg+xml:
              schema: { type: string }
  /assets/fortisnet-lockup.svg:
    get:
      tags: [System]
      operationId: nodeWordmark
      summary: FortisNet wordmark
      description: Embedded FortisNet wordmark.
      security: []
      responses:
        '200':
          description: FortisNet wordmark.
          content:
            image/svg+xml:
              schema: { type: string }
  /assets/social-preview.jpg:
    get:
      tags: [System]
      operationId: nodeSocialPreview
      summary: FortisNet social preview
      description: Embedded 1200 by 630 FortisNet blockchain concept image.
      security: []
      responses:
        '200':
          description: FortisNet social preview.
          content:
            image/jpeg:
              schema: { type: string }
  /statusz:
    get:
      tags: [System]
      operationId: status
      summary: Public liveness detail for the landing page
      description: >-
        Version, runtime, uptime, process CPU, process memory, storage-volume
        usage and live-traffic aggregates
        (request/error/distinct-client counts over 5m/10m windows plus a
        15-minute per-minute series, from an in-memory ring). Polled by the
        landing page; discloses only aggregate counts and route templates —
        never device identifiers, addresses, data or keys. The TypeScript
        server reports its Node.js version in `node` and V8 process memory.
        The native C++ server (host build or Unikraft guest) reports a native
        runtime label in `node` (never a Node.js version) and reports memory
        values as null where they cannot be measured; it does not yet emit the
        optional coordinator and tokenRefresh blocks.
      security: []
      responses:
        '200':
          description: Process status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, node, uptimeSec, memory, cpu, disk, stats]
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
                  node:
                    type: string
                    description: >-
                      Runtime identifier: the Node.js version on the
                      TypeScript server; a native runtime label
                      (`native-cpp` on the host, `native-cpp-unikraft` in the
                      guest) on the native server.
                  uptimeSec:
                    type: integer
                  memory:
                    type: object
                    required: [rss, heapUsed]
                    properties:
                      rss:
                        type: integer
                        nullable: true
                        description: >-
                          Resident set size in bytes. Always an integer on the
                          TypeScript server; null on the native server when the
                          platform exposes no /proc/self/statm (the Unikraft
                          guest).
                      heapUsed:
                        type: integer
                        nullable: true
                        description: >-
                          Heap bytes in use. TypeScript reports V8 heapUsed.
                          The native guest reports bytes currently allocated
                          through the Unikraft default allocator (allocations
                          it tracks, not every library heap or thread stack);
                          null where no allocator statistics exist (the native
                          host build).
                  cpu:
                    type: object
                    required: [percent]
                    properties:
                      percent:
                        type: number
                        nullable: true
                        description: >-
                          Process CPU time as a percent of one logical core
                          since the previous one-second sample. Null until a
                          second sample is available or CPU time is unavailable.
                          Multi-core work may exceed 100 percent.
                  disk:
                    type: object
                    nullable: true
                    required: [used, total]
                    description: >-
                      Filesystem containing the persistent KV store. On a guest
                      mount without capacity reporting, used is a bounded scan
                      of persisted files and total is null. The scan refreshes
                      at most once per 30 seconds. Null if measurement fails.
                    properties:
                      used: { type: integer, format: int64, description: Used bytes on the data filesystem, or allocated bytes in a bounded data-tree scan when capacity is unavailable. See native resources.diskScope. }
                      total: { type: integer, format: int64, nullable: true, description: Total filesystem bytes when available. }
                  resources:
                    type: object
                    description: >-
                      Native-only background OS sample. Unsupported counters are null.
                      Process fields do not describe whole-host utilization. Cgroup v2
                      values describe the process's local group, may include other
                      processes and file cache, and may have tighter ancestor limits.
                      Unlimited quotas and inaccessible counters both render null.
                      Filesystem sampling runs about every 30 seconds outside HTTP workers.
                    properties:
                      sampledAtMs: {type: integer, format: int64}
                      peakRssBytes: {type: integer, minimum: 0, nullable: true}
                      virtualBytes: {type: integer, minimum: 0, nullable: true}
                      threads: {type: integer, nullable: true}
                      openDescriptors: {type: integer, nullable: true}
                      readBytesSinceBoot: {type: integer, minimum: 0, nullable: true, description: Process storage-layer read accounting; not network bytes.}
                      writtenBytesSinceBoot: {type: integer, minimum: 0, nullable: true}
                      cgroupMemoryBytes: {type: integer, minimum: 0, nullable: true}
                      cgroupMemoryLimitBytes: {type: integer, minimum: 0, nullable: true}
                      cpuQuotaCores: {type: number, nullable: true}
                      diskSampledAtMs: {type: integer, format: int64}
                      diskAvailableBytes: {type: integer, minimum: 0, nullable: true, description: Filesystem bytes available to this process; reserved blocks excluded.}
                      diskScope: {type: string, enum: [filesystem, data-tree, unavailable]}
                  stats:
                    type: object
                    required: [window5m, window10m, topRoutes10m, perMinute]
                    properties:
                      window5m:
                        $ref: '#/components/schemas/TrafficWindow'
                      window10m:
                        $ref: '#/components/schemas/TrafficWindow'
                      topRoutes10m:
                        type: array
                        items:
                          type: object
                          required: [route, requests, errors]
                          properties:
                            route:
                              type: string
                              description: Route template, never a raw URL.
                            requests:
                              type: integer
                            errors:
                              type: integer
                      perMinute:
                        type: array
                        description: One point per tracked minute, oldest first.
                        items:
                          type: object
                          required: [startSec, requests, errors, clients]
                          properties:
                            startSec:
                              type: integer
                              description: Start of the minute, epoch seconds.
                            requests:
                              type: integer
                            errors:
                              type: integer
                            clients:
                              type: integer
  /metrics:
    get:
      tags: [System]
      operationId: prometheusMetrics
      summary: Protected Prometheus metrics
      description: >-
        Operational counters with bounded route-template labels. Disabled with
        404 unless METRICS_TOKEN is configured; then requires that dedicated
        bearer. Never emits addresses, device ids, cache keys or dynamic hosts.
      security: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid metrics bearer.
        '404':
          description: Metrics disabled for this deployment.
  /admin/tickets:
    get:
      tags: [Support]
      operationId: ticketsPage
      security:
        - supportAdminBasic: []
      summary: Operator ticket list (HTML)
      description: >-
        HTML view of every help-desk ticket, with one thread expanded
        via `?open={ticketId}`. Root-scoped, so no device bearer applies.
        The route is disabled unless SUPPORT_ADMIN_TOKEN is configured and then
        requires that dedicated credential. STAGING ONLY until wallet-admin's
        staff identity, RBAC and audit trail move here.
      parameters:
        - name: open
          in: query
          required: false
          schema: { type: string }
          description: Ticket id whose thread to render above the list.
      responses:
        '200':
          description: Ticket list HTML.
          content:
            text/html:
              schema: { type: string }
  /admin/tickets/{id}/reply:
    post:
      tags: [Support]
      operationId: replyToTicketFromStagingConsole
      security:
        - supportAdminBasic: []
      summary: Reply to a ticket from the staging console
      description: >-
        Requires SUPPORT_ADMIN_TOKEN (HTTP Basic password or bearer). Staging
        bridge only; production must use the authenticated wallet-admin proxy.
        Outbound secret requests, unknown links and secret material are rejected
        before persistence.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        '303': { description: Reply stored; redirects back to the thread. }
        '422': { description: Outbound safety policy blocked the reply. }
  /admin/tickets/{id}/status:
    post:
      tags: [Support]
      operationId: setTicketStatusFromStagingConsole
      summary: Update a ticket's lifecycle state
      security:
        - supportAdminBasic: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, pending, resolved, closed]
      responses:
        '303': { description: Status stored; redirects back to the thread. }

  /v1/support/auth/verify:
    post:
      tags: [Support]
      operationId: verifySupportIdentity
      summary: Verify a client-created wallet proof and start a support session
      description: |
        The client signs an EIP-191 message containing exactly Address, Nonce,
        and Timestamp. The timestamp must be at most five minutes old and the
        random 128-bit nonce is consumed atomically on successful verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, nonce, timestamp, signature]
              properties:
                address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                nonce: { type: string, pattern: '^[0-9a-f]{32}$' }
                timestamp: { type: string, format: date-time }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportVerifyRequest' }
      responses:
        '200':
          description: A short-lived access token and rotating refresh token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAuthSession' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportAuthResponse' }
        '401':
          description: The proof is stale, already used, future-dated, or the signature does not match.

  /v1/support/auth/refresh:
    post:
      tags: [Support]
      operationId: refreshSupportIdentity
      summary: Rotate a support refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportRefreshRequest' }
      responses:
        '200':
          description: Replacement access and refresh tokens. The submitted refresh token is invalidated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAuthSession' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportAuthResponse' }
        '401':
          description: Refresh token missing, expired, already rotated, or issued to another device.

  /v1/support/tickets:
    post:
      tags: [Support]
      operationId: openSupportTicket
      summary: Open a support ticket
      security:
        - deviceBearer: []
          supportSession: []
      description: |
        Files a ticket for the authenticated wallet. Subject and body are
        scanned for secret material and redacted **before persistence**; when a
        rule fires, `secretRemoved` is true. Security warning text is compiled
        into the app and is never supplied by this service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenTicketRequest' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.OpenSupportTicketRequest' }
      responses:
        '201':
          description: Ticket opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketThread' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportThreadResponse' }
        '400':
          description: Validation or policy failure.
    get:
      tags: [Support]
      operationId: listSupportTickets
      summary: This verified wallet's tickets
      security:
        - deviceBearer: []
          supportSession: []
      responses:
        '200':
          description: Tickets, newest activity first.
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/SupportTicket' }
                  unreadCount: { type: integer, minimum: 0 }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportTicketsResponse' }

  /v1/support/tickets/{id}:
    get:
      tags: [Support]
      operationId: getSupportTicket
      summary: One thread this verified wallet owns
      security:
        - deviceBearer: []
          supportSession: []
      description: >-
        Returns 404 rather than 403 for another wallet's ticket: the
        distinction would confirm the id exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketThread' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SupportThreadResponse' }
        '404':
          description: No such ticket for this wallet.

  /v1/support/tickets/{id}/messages:
    post:
      tags: [Support]
      operationId: postSupportMessage
      summary: Reply in a thread this verified wallet owns
      security:
        - deviceBearer: []
          supportSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 8000 }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PostSupportMessageRequest' }
      responses:
        '201':
          description: Message stored (post-redaction).
          content:
            application/json:
              schema:
                type: object
                required: [message, secretRemoved]
                properties:
                  message: { $ref: '#/components/schemas/SupportMessage' }
                  secretRemoved:
                    type: boolean
                    description: True when secret material was removed before persistence.
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PostSupportMessageResponse' }
        '400':
          description: Empty, too long, or the conversation is closed.
        '404':
          description: No such ticket for this wallet.

  /errors:
    get:
      tags: [System]
      operationId: errorsPage
      summary: Human-facing error board
      description: >-
        Public HTML page listing server-side (5xx) responses per service over
        the tracked window, with a per-service threshold flag. Linked from the
        landing page's Service box. Not consumed by the app.
      security: []
      responses:
        '200':
          description: Error board HTML.
          content:
            text/html:
              schema:
                type: string
  /errorsz:
    get:
      tags: [System]
      operationId: errorsFeed
      summary: Live data for the error board
      description: >-
        Aggregated 5xx counts per route template with service attribution and
        a bounded newest-first log of recent errors. Same disclosure level as
        /statusz — counts, templates and HTTP status codes only.
      security: []
      responses:
        '200':
          description: Error aggregates snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [ok, threshold, windowMinutes, totalErrors, totalRequests, routes, recent]
                properties:
                  ok:
                    type: boolean
                  operational:
                    type: object
                    description: Bounded persisted operational failures with stable public codes. Never includes credentials, wallet contents, AI messages or upstream bodies.
                    required: [persisted, writeFailed, records]
                    properties:
                      persisted: { type: boolean }
                      writeFailed: { type: boolean }
                      records:
                        type: array
                        maxItems: 64
                        items:
                          type: object
                          required: [origin, provider, httpStatus, service, code, identifier, count, firstSeenMs, lastSeenMs]
                          properties:
                            origin:
                              type: string
                              enum: [node, third_party, unclassified]
                              description: Observed origin, not an assertion about ultimate root cause. Legacy summaries and missing-price outcomes are unclassified.
                            provider:
                              type: string
                              maxLength: 32
                              description: Stable provider label; empty when unknown. Never a URL, host or user identifier.
                            httpStatus:
                              type: integer
                              nullable: true
                              minimum: 100
                              maximum: 599
                              description: Observed upstream HTTP status, null when none was received.
                            service: { type: string }
                            code: { type: string }
                            identifier: { type: string }
                            count: { type: integer }
                            firstSeenMs: { type: integer }
                            lastSeenMs: { type: integer }
                  threshold:
                    type: integer
                    description: Errors per route in the window at which a service is flagged.
                  windowMinutes:
                    type: integer
                  totalErrors:
                    type: integer
                  totalRequests:
                    type: integer
                  routes:
                    type: array
                    items:
                      type: object
                      required: [service, route, requests, errors, overThreshold]
                      properties:
                        service:
                          type: string
                        route:
                          type: string
                          description: Route template, never a raw URL.
                        requests:
                          type: integer
                        errors:
                          type: integer
                        overThreshold:
                          type: boolean
                  recent:
                    type: array
                    items:
                      type: object
                      required: [sec, service, route, status]
                      properties:
                        sec:
                          type: integer
                          description: Epoch seconds of the response.
                        service:
                          type: string
                        route:
                          type: string
                        status:
                          type: integer
  /assets/background.jpg:
    get:
      tags: [System]
      operationId: landingBackground
      summary: Landing page hero background image
      description: Static JPEG used by the landing page. Served with a one-day public cache.
      security: []
      responses:
        '200':
          description: JPEG bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: The image asset was not shipped with this deployment.
  /healthz:
    get:
      tags: [System]
      operationId: health
      summary: Check server liveness
      description: Lightweight process health check. It does not verify every upstream provider.
      security: []
      responses:
        '200':
          description: Server process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, example: true }
  /v1/media/{key}:
    get:
      tags: [System]
      operationId: getMedia
      summary: Read a verified cached image
      description: Public content-addressed image proxy. Only URLs previously registered by the server can resolve; responses are raster-byte verified and immutable.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: 32-character lowercase hexadecimal media key.
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: Verified image bytes. The exact raster media type is returned in Content-Type.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=31536000, immutable' }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices/challenge:
    post:
      tags: [Device authentication]
      operationId: createAttestationChallenge
      summary: Create a one-time attestation challenge
      security: []
      responses:
        '200':
          description: Challenge valid for five minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationChallenge' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.AttestationChallengeResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/devices:
    post:
      tags: [Device authentication]
      operationId: enrollDevice
      summary: Enroll an app installation
      description: Returns the bearer token exactly once. Development enrollment is accepted only from loopback or a private network; production must validate platform attestation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceEnrollment' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.EnrollDeviceRequest' }
      responses:
        '201':
          description: Device enrolled; store `deviceToken` in platform secure storage.
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, deviceToken, expiresAt]
                properties:
                  deviceId: { type: string }
                  deviceToken: { type: string, writeOnly: true, example: fintel_dev_... }
                  expiresAt: { type: string, format: date-time }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.EnrollDeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/devices/rotate:
    post:
      tags: [Device authentication]
      operationId: rotateDeviceToken
      summary: Replace the current device bearer token
      description: The old token becomes invalid immediately. This endpoint does not rotate third-party provider keys.
      responses:
        '200':
          description: Replacement token.
          content:
            application/json:
              schema:
                type: object
                required: [deviceToken, expiresAt]
                properties:
                  deviceToken: { type: string, writeOnly: true }
                  expiresAt: { type: string, format: date-time }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.RotateDeviceTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/crash-reports:
    post:
      tags: [Diagnostics]
      operationId: submitCrashReport
      summary: Submit a redacted client crash report
      description: |
        Accepts a bounded Flutter or root-isolate error report for the authenticated
        installation. The client excludes wallet state and request data; both client
        and server redact bearer tokens, long address-like values and user-directory
        names. Reports expire after 30 days. There is intentionally no client read API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrashReportRequest' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.CrashReportRequest' }
      responses:
        '202':
          description: Report accepted for operational diagnosis.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, id]
                properties:
                  accepted: { type: boolean, example: true }
                  id: { type: string }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.CrashReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/ai/conversations:
    post:
      tags: [AI]
      operationId: openIntelligenceConversation
      summary: Open a wallet-signed conversation with its first message
      description: |
        The client proves control of an EVM address by signing (EIP-191) the
        text `FortisNet Intelligence conversation v1` followed by the address,
        device id, nonce, timestamp, snapshot SHA-256 and session-token SHA-256,
        one per line. The portfolio snapshot is stored with the conversation.
        The user turn and pending reply job are committed atomically before an
        immediate HTTP 201 acknowledgement. Anthropic generation runs in bounded
        background workers; no assistant reply is promised in this response.
        Poll message history for reply status. Provider failures are saved as
        retryable statuses and never change accepted turns into synchronous 503s.
        The model API key remains on the server. Retrying the same
        `clientMessageId` preserves the saved turn. A signed open for the same
        wallet/device reuses its durable conversation and rotates the chat token.
        Limited to 20 opens per device per hour; new wallet-owned threads do not
        expire automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address, nonce, timestamp, snapshotHash, accessToken, accessTokenHash, snapshotJson, signature, firstMessage, clientMessageId]
              properties:
                address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                nonce: { type: string, pattern: '^[0-9a-f]{32}$' }
                timestamp: { type: string, format: date-time }
                snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                accessToken: { type: string, pattern: '^fintel_chat_[A-Za-z0-9_-]{43}$' }
                accessTokenHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                snapshotJson: { type: string, minLength: 2, maxLength: 300000 }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$' }
                firstMessage: { type: string, minLength: 1, maxLength: 8000 }
                clientMessageId: { type: string, pattern: '^[0-9a-f]{32}$' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.OpenConversationRequest' }
      responses:
        '201':
          description: Conversation opened (or the existing one for this first message).
          content:
            application/json:
              schema:
                type: object
                required: [id, accessToken, message]
                properties:
                  id: { type: string }
                  accessToken: { type: string }
                  message:
                    type: object
                    required: [id, body, createdAt]
                    properties:
                      id: { type: string }
                      body: { type: string }
                      createdAt: { type: string, format: date-time }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.OpenConversationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing device token, or the signature/snapshot proof is invalid (`PROOF_INVALID`).
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: Storage or response construction failed. Retry idempotently with the same client message ID.
  /v1/ai/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      tags: [AI]
      operationId: listIntelligenceMessages
      summary: Messages of a conversation this device owns
      description: The newest page includes the latest user turn's durable reply status. Older pages omit reply-status headers. Rows are oldest first within each page.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: Defaults to 100 without a cursor and 20 with before. }
        - { name: before, in: query, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }, description: Exclusive message cursor. }
      security:
        - deviceBearer: []
          intelligenceConversation: []
      responses:
        '200':
          description: Messages, oldest first.
          headers:
            x-next-cursor:
              schema: { type: string }
              description: Exclusive cursor for an earlier page, when available.
            x-ai-reply-for:
              schema: { type: string }
              description: Latest user-message ID whose reply status is reported.
            x-ai-reply-status:
              schema:
                type: string
                enum: [pending, running, complete, failed, model_missing, no_credits, auth_failed, rate_limited, token_limit, unavailable, invalid_reply]
              description: Durable generation status; failures may be retried through the retry endpoint.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/IntelligenceMessage' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.ConversationMessagesResponse' }
        '404':
          description: Unknown, expired, or not this device's conversation (never distinguished).
    post:
      tags: [AI]
      operationId: postIntelligenceMessage
      summary: Save a user turn and queue its reply asynchronously
      description: |
        Idempotent per `clientMessageId`. Supply both `snapshotJson` and
        `snapshotHash` when refreshing the portfolio context; otherwise the
        server reuses the conversation's last snapshot. The snapshot used for
        this turn and its pending job are committed before HTTP 201. Generation
        and provider failures are observed by polling message history. The mobile
        app refreshes local context on the first message after ten minutes.
        Limited to 120 messages per device per hour.
      security:
        - deviceBearer: []
          intelligenceConversation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientMessageId, body]
              properties:
                clientMessageId: { type: string, pattern: '^[0-9a-f]{32}$' }
                body: { type: string, minLength: 1, maxLength: 8000 }
                snapshotJson: { type: string, minLength: 2, maxLength: 300000 }
                snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PostConversationMessageRequest' }
      responses:
        '201':
          description: Message stored (or the existing one for this `clientMessageId`).
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/IntelligenceMessage' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PostConversationMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown, expired, or not this device's conversation (never distinguished).
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: Storage or response construction failed. Retry idempotently with the same client message ID.
  /v1/networks:
    get:
      tags: [Capabilities]
      operationId: listNetworks
      summary: List networks and available server features
      description: Use this capability document instead of hardcoding which analytics each chain supports.
      responses:
        '200':
          description: Network, balance, transfer, NFT, trustline, transaction-detail and price capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [networks, prices]
                properties:
                  networks:
                    type: array
                    items: { $ref: '#/components/schemas/NetworkCapability' }
                  prices: { type: object, additionalProperties: true }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.NetworksResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/networks/{network}/overview:
    get:
      tags: [Capabilities]
      operationId: getNetworkOverview
      summary: Read network-specific news and popular tokens
      description: |
        Returns editorial news matched to explicit network aliases and a
        provider-ranked token list. `holderCount`, when present, is an on-chain
        holder count, not a count of Fortis users. Sections report availability
        and freshness independently so one upstream outage does not blank the
        other card.
      parameters:
        - name: network
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Network-level discovery data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkOverview' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.NetworkOverviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/dashpay/names/resolve:
    get:
      tags: [DashPay]
      operationId: resolveDashPayName
      summary: Resolve a DPNS username to its current Platform identity
      description: |
        Uses the official Evo SDK in trusted mode to verify the Platform proof.
        The returned identity is not a Dash Core payment address; clients must
        require an established encrypted DashPay contact channel before paying.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 69 }
          examples:
            label: { value: alice }
            fullyQualified: { value: alice.dash }
      responses:
        '200':
          description: Canonical name and current identity, or null when the name is unregistered.
          content:
            application/json:
              schema:
                type: object
                required: [name, identityId]
                properties:
                  name: { type: string, example: alice.dash }
                  identityId: { type: string, nullable: true }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.DashPayNameResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/prices:
    get:
      tags: [Prices]
      operationId: getSpotPrices
      summary: Read spot prices for up to 100 assets
      description: A quote is per displayed unit, as markets quote it. For a Solana mint that scales the amount it displays (ScaledUiAmount, InterestBearing), that is the on-chain amount times the mint's multiplier; the balances endpoint reports it as a token's `displayUnits`.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated price IDs such as `ethereum`, `spl:<mint>`, `asa:<id>`, `<evm-network>:erc20:<address>`, `tron:trc20:<address>` or `tron:trc10:<numeric-id>`.
          schema: { type: string, maxLength: 4000 }
        - $ref: '#/components/parameters/Fiat'
      responses:
        '200':
          description: Price map with cache provenance on each returned quote, plus missing and invalid ID lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpotPriceResponse' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.SpotPriceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
  /v1/prices/history:
    get:
      tags: [Prices]
      operationId: getPriceHistory
      summary: Read one token price series
      description: Fills missing portions from upstream and persists fetched candles. Hourly windows are capped at 90 days and daily windows at 10 years.
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Interval'
      responses:
        '200':
          description: Available points, requested bounds, cache provenance and actual availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceHistory' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PriceHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
    post:
      tags: [Prices]
      operationId: getPriceHistoryBatch
      summary: Read comparison series for up to 50 tokens
      description: Fetches every series independently, so one unavailable token does not fail the comparison. Existing cached days are reused and only missing time gaps are fetched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, from, to]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 200 }
                from: { type: integer, format: int64, minimum: 1, description: Inclusive Unix time in seconds. }
                to: { type: integer, format: int64, minimum: 1, description: Exclusive Unix time in seconds. }
                interval: { $ref: '#/components/schemas/Interval' }
          application/protobuf:
            schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PriceHistoryBatchRequest' }
      responses:
        '200':
          description: Per-ID series or per-ID error, plus aggregate cache provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceHistoryBatch' }
            application/protobuf:
              schema: { type: string, format: binary, description: 'fortisnet.intelligence.v1.PriceHistoryBatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/networks/{network}/address/{address}/token-holdings:
    get:
      tags: [Accounts]
      operationId: getTronTokenHoldings
      summary: Read Tron fungible token holdings through the keyed server transport
